<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#080d14">
  <title>ParcelScope</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">ParcelScope</div>
    <div class="login-sub">Enter your 4-digit access code</div>

    <input
      id="loginCode"
      type="password"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
      placeholder="••••"
    >

    <button id="loginBtn" class="primary">
      Log In
    </button>

    <div id="loginError" class="error"></div>
  </div>
</div>


<header class="topbar">

  <button id="menuBtn" class="hamburger">
    ☰
  </button>

  <div class="brand">
    ParcelScope
  </div>

  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="Search address, owner, parcel ID..."
      autocomplete="off"
    >

    <select id="stateSelect">
      <option value="ALL">All States</option>
      <option value="WA">Washington</option>
      <option value="OR">Oregon</option>
      <option value="ID">Idaho</option>
      <option value="MT">Montana</option>
    </select>

    <button id="searchBtn">
      Search
    </button>

  </div>

  <button id="locateBtn" class="locate">
    Locate
  </button>

</header>


<div id="map"></div>


<aside id="menu" class="menu hidden">

  <div class="menuTop">
    <strong>ParcelScope</strong>

    <button id="closeMenu">
      ×
    </button>
  </div>

  <div class="account-chip">
    <span id="menuUserName">User</span>
    <small id="menuUserCode"></small>
  </div>

  <button data-page="saved">
    Saved Properties
  </button>

  <button data-page="recent">
    Recent Properties
  </button>

  <button data-page="notifications">
    Notifications
    <span id="menuRedDot" class="red-dot hidden"></span>
  </button>

  <button data-page="layers">
    Map Layers
  </button>

  <button data-page="measure">
    Measure Distance
  </button>

  <button data-page="settings">
    Settings
  </button>

  <button data-page="about">
    About ParcelScope
  </button>

  <button id="adminMenu" class="admin-only hidden">
    Admin
  </button>

  <button id="logoutBtn" class="danger-btn">
    Log Out
  </button>

</aside>


<section id="drawer" class="drawer hidden">

  <div class="drawerTop">
    <h2 id="drawerTitle"></h2>

    <button id="drawerClose">
      ×
    </button>
  </div>

  <div id="drawerBody"></div>

</section>


<section id="property" class="property hidden">

  <div class="propertyTop">

    <div>
      <small>SELECTED PARCEL</small>

      <h2 id="propertyTitle">
        Property
      </h2>
    </div>

    <button id="propertyClose">
      ×
    </button>

  </div>

  <div id="propertyBody"></div>

  <div class="propertyActions">

    <button id="saveBtn">
      Save Property
    </button>

    <button id="shareBtn">
      Share Parcel Link
    </button>

    <button id="mapsBtn">
      Open Property In
    </button>

  </div>

</section>


<section id="results" class="results hidden">

  <div class="drawerTop">

    <h2>
      Search Results
    </h2>

    <button id="resultsClose">
      ×
    </button>

  </div>

  <div id="resultsBody"></div>

</section>


<section id="mapsModal" class="modal hidden">

  <div class="modalCard">

    <div class="drawerTop">

      <h2>
        Open Property In
      </h2>

      <button id="mapsClose">
        ×
      </button>

    </div>

    <button id="appleBtn">
      Apple Maps
    </button>

    <button id="googleBtn">
      Google Maps
    </button>

    <button id="mapsCancel">
      Cancel
    </button>

  </div>

</section>


<div id="measure" class="measure hidden">

  <strong>
    Measure Distance
  </strong>

  <span id="measureValue">
    0 ft
  </span>

  <button id="finishMeasure">
    Finish
  </button>

  <button id="clearMeasure">
    Clear
  </button>

</div>


<div id="coords" class="coords hidden"></div>

<div id="toast" class="toast hidden"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="script.js"></script>

</body>
</html>
