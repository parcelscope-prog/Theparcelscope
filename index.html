<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ParcelScope Idaho</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <!-- TOP BAR -->
    <header class="topbar">

        <button id="menuButton" class="icon-button" aria-label="Open menu">
            ☰
        </button>

        <div class="brand">
            <div class="brand-title">PARCELSCOPE</div>
            <div class="brand-subtitle">IDAHO PROPERTY RESEARCH</div>
        </div>

        <div class="search-wrapper">

            <input
                id="searchInput"
                type="search"
                placeholder="Search something... I'm good but I can't read minds."
                autocomplete="off"
            >

            <button id="searchButton" class="search-button">
                SEARCH
            </button>

        </div>

    </header>


    <!-- MAP STATUS -->
    <div id="mapStatus" class="map-status">
        <span id="mapStatusText">Loading Idaho GIS data...</span>
    </div>


    <!-- SIDE MENU -->
    <aside id="sideMenu" class="side-menu">

        <div class="menu-header">

            <div>
                <div class="menu-kicker">PARCELSCOPE</div>
                <div class="menu-title">Menu</div>
            </div>

            <button id="closeMenu" class="close-button">
                ×
            </button>

        </div>

        <div class="menu-items">

            <button class="menu-item" data-section="counties">
                <span>▦</span>
                <span>Counties</span>
            </button>

            <button class="menu-item" data-section="saved">
                <span>★</span>
                <span>Saved Properties</span>
            </button>

            <button class="menu-item" data-section="sources">
                <span>◈</span>
                <span>Data Sources</span>
            </button>

            <button class="menu-item" data-section="history">
                <span>↻</span>
                <span>Update History</span>
            </button>

            <button class="menu-item" data-section="settings">
                <span>⚙</span>
                <span>Settings</span>
            </button>

            <button class="menu-item" data-section="about">
                <span>ⓘ</span>
                <span>About ParcelScope</span>
            </button>

        </div>

    </aside>


    <!-- SEARCH RESULTS -->
    <section id="searchResults" class="floating-panel search-results">

        <div class="panel-header">

            <div>
                <div class="panel-kicker">SEARCH</div>
                <div class="panel-title">Results</div>
            </div>

            <button id="closeResults" class="close-button">
                ×
            </button>

        </div>

        <div id="resultsContent" class="results-content"></div>

    </section>


    <!-- PROPERTY PANEL -->
    <section id="propertyPanel" class="floating-panel property-panel">

        <div class="panel-header">

            <div>
                <div class="panel-kicker">PROPERTY</div>
                <div id="propertyTitle" class="panel-title">
                    Property
                </div>
            </div>

            <button id="closeProperty" class="close-button">
                ×
            </button>

        </div>

        <div id="propertyContent" class="property-content"></div>

    </section>


    <!-- APP PAGE -->
    <section id="appPage" class="app-page">

        <div class="app-page-inner">

            <div class="app-page-header">

                <div>

                    <div id="appPageKicker" class="page-kicker">
                        PARCELSCOPE
                    </div>

                    <h1 id="appPageTitle">
                        ParcelScope
                    </h1>

                </div>

                <button id="closeAppPage" class="close-button">
                    ×
                </button>

            </div>

            <div id="appPageContent" class="app-page-content"></div>

        </div>

    </section>


    <!-- GLITCH MESSAGE -->
    <div id="glitchMessage" class="glitch-message" aria-hidden="true">
        <div class="glitch-line red">MAP CAN'T STRETCH THAT FAR</div>
        <div class="glitch-line blue">ZOOM IN</div>
        <div class="glitch-line multi">PARCELSCOPE</div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>

</body>
</html>
